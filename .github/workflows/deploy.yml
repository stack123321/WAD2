# Owner: Surya. Rebuild the live site on Vercel whenever anyone pushes to main.
# Vercel's free plan blocks deploys from commits by people who aren't on the Vercel project (our
# teammates), so GitHub triggers the deploy instead, through a Vercel Deploy Hook.
# The hook's URL is secret: it's stored in GitHub → Settings → Secrets and variables → Actions
# as VERCEL_DEPLOY_HOOK, never in the code.
name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to build main
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
