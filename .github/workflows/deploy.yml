# Owner: Surya. Rebuild the live site on Vercel whenever anyone pushes to main.
# Vercel's free plan blocks deploys of commits made by people who aren't on the Vercel project
# (our teammates), even when a deploy hook starts them. So GitHub builds the site here and uploads
# it with Surya's Vercel token: the deploy then counts as Surya's, and isn't blocked.
# Secrets (GitHub → Settings → Secrets and variables → Actions), never in the code:
#   VERCEL_TOKEN       Surya's Vercel access token (works like a password: keep it secret)
#   VERCEL_ORG_ID      the Vercel team/account ID (team_...)
#   VERCEL_PROJECT_ID  the Vercel project ID (prj_...)
# The site's own keys (Supabase, OneMap, LTA, Google) stay in Vercel's settings; "vercel pull"
# fetches them for the build.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  # also a "Run workflow" button on the Actions tab, to deploy again without pushing
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use Node 22 (same as package.json "engines")
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Vercel command-line tool
        run: npm install --global vercel@latest

      # Shows whether the 3 secrets arrived, and what the token can see. Prints only the start of
      # the two IDs (they aren't secret) and the token's LENGTH, never the token itself.
      - name: Check the Vercel secrets
        env:
          TOKEN_CHECK: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN_CHECK" ]; then echo "VERCEL_TOKEN: EMPTY"; else echo "VERCEL_TOKEN: set (${#TOKEN_CHECK} characters)"; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID: EMPTY"; else echo "VERCEL_ORG_ID starts with: ${VERCEL_ORG_ID:0:5} (${#VERCEL_ORG_ID} characters)"; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "VERCEL_PROJECT_ID: EMPTY"; else echo "VERCEL_PROJECT_ID starts with: ${VERCEL_PROJECT_ID:0:4} (${#VERCEL_PROJECT_ID} characters)"; fi
          echo "--- Logged in as:"
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel whoami --token="$TOKEN_CHECK" || true
          echo "--- Teams this token can use:"
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel teams ls --token="$TOKEN_CHECK" || true
          echo "--- Projects this token can see:"
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel project ls --token="$TOKEN_CHECK" || true

      - name: Download the project settings and keys from Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build the site (same as npm run build, plus the api/ functions)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload it to Vercel as the live site
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
