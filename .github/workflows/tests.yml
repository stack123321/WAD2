# Owner: Eashvar (testing). Runs the end-to-end tests (tests/e2e) on every pull request into main
# and every push to main, and shows a pass/fail check on the PR. Needs no keys or secrets: the
# tests use the sample hangouts and stub Google and Gemini. If it fails, open the run's Summary
# and download "playwright-report" to see what broke (with screenshots).
# The live tests (tests/live) sign in to the real Supabase project, so they're run by hand instead.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # also a "Run workflow" button on the Actions tab
  workflow_dispatch:

# A newer push to the same PR cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use Node 22 (same as package.json "engines")
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Download the test browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npx oxlint . && npx eslint .

      - name: Build
        run: npm run build

      - name: Run the tests
        run: npx playwright test
        env:
          CI: true

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
